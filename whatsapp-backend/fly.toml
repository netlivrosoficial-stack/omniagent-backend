app = "whatsapp-backend-silent-mountain-8291"
kill_signal = "SIGINT"
kill_timeout = "5s"
primary_region = "gru"

[env]
PORT = "8080"

[build]
# Usamos o Dockerfile existente

[mounts]
source="whatsapp_data"
destination="/home/node/.wwebjs_auth"

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = true
auto_start_machines = true
min_machines_running = 1 # Garante anti-cold start
processes = ["app"] # CORREÇÃO: Mapeia o processo 'app' para este serviço HTTP

[[vm]]
cpu_kind = "shared"
cpus = 1
memory_mb = 1024 # Garante RAM para o Chromium

[processes]
app = "node server.js" # Define o processo 'app' para ser o servidor Node