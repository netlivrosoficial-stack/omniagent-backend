app = "whatsapp-backend-silent-mountain-8291"
primary_region = "gru"

[build]
  workdir = "/usr/src/app"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[mounts]]
  source="whatsapp_data"
  destination="/usr/src/app/.wwebjs_auth"

[processes]
  app = "npm start"