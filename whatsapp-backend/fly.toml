app = "whatsapp-backend-silent-mountain-8291"
kill_signal = "SIGINT"
kill_timeout = "5s"
primary_region = "gru"

[env]
PORT = "8080"

[build]
# Usamos o Dockerfile existente

[mounts]
source="whatsapp_data"
destination="/home/node/.wwebjs_auth"

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = true
auto_start_machines = true
min_machines_running = 1 
processes = ["app"] 

  # ----------------------------------------------------
  # CORREÇÃO CRÍTICA PARA A ESTABILIDADE (HEALTH CHECK)
  # Adicionado diretamente ao http_service
  # ----------------------------------------------------
  [http_service.checks]
    interval = "10s"
    timeout = "2s"
    grace_period = "5s"
    path = "/" 

[[vm]]
cpu_kind = "shared"
cpus = 1
memory_mb = 1024 

[processes]
app = "node server.js"