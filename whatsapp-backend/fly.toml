app = "whatsapp-backend-silent-mountain-8291"
kill_signal = "SIGINT"
kill_timeout = "5s"
primary_region = "gru"

[env]
PORT = "8080"

[build]
# Usamos o Dockerfile existente

[mounts]
source="whatsapp_data"
destination="/home/node/.wwebjs_auth"

# REMOVIDO [http_service] PARA EVITAR CONFLITO COM [[services]]

[[vm]]
cpu_kind = "shared"
cpus = 1
memory_mb = 1024 

[processes]
app = "node server.js" 

# O bloco [[services]] ABAIXO SUBSTITUI O [http_service] E ADICIONA O HEALTH CHECK
[[services]]
  internal_port = 8080
  protocol = "tcp"
  # Esta linha mapeia o processo 'app' para este serviço:
  processes = ["app"]
  
  # Anti-Cold Start:
  [services.concurrency]
    type = "shared"
    hard_limit = 25
    soft_limit = 20
  
  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.http_checks]]
    interval = "10s"
    timeout = "2s"
    grace_period = "5s"
    path = "/"